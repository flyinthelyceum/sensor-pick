<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="20"><title>Sensor Pairs</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0d;--panel:#131317;--line:#26262d;--ink:#ecebe6;--dim:#9a998f;--main:#e8b400}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:32px 16px}
.k{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
h1{font-weight:500;font-size:clamp(30px,6vw,56px);margin:10px 0 24px}
.pairs{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px}
.pairs li{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:grid;grid-template-columns:44px 1fr;gap:4px 10px}
.n{grid-row:span 2;font-family:"IBM Plex Mono",monospace;font-size:28px;color:var(--main)}
.who{font-size:19px;font-weight:600;line-height:1.3}.s{font-family:"IBM Plex Mono",monospace;font-size:13.5px;color:var(--dim)}
.s small{display:block;font-size:12px;margin-top:3px}
.wait{font-size:clamp(28px,5vw,48px);color:var(--main);font-family:"IBM Plex Mono",monospace}
.foot{color:var(--dim);margin-top:22px;font-size:16px}
</style></head><body><div class="wrap"><div class="k">Computer Coding Studio · The Sensor Layer · Final pairs</div><h1>Pairs</h1>
<p class="wait">Pairs post at 11:55.</p>
<p class="foot">This page refreshes itself. Leave it open.</p>
</div></body></html>
